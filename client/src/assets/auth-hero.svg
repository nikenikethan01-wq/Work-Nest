<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1600 1200" preserveAspectRatio="xMidYMid slice" xmlns:c2pa="http://c2pa.org/manifest"><metadata><c2pa:manifest></c2pa:manifest></metadata>
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#2f7bff"/>
      <stop offset="1" stop-color="#0a2f7a"/>
    </linearGradient>
    <linearGradient id="accent" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#5aa0ff"/>
      <stop offset="1" stop-color="#1b6cff"/>
    </linearGradient>
    <pattern id="dots" width="40" height="40" patternUnits="userSpaceOnUse">
      <circle cx="4" cy="4" r="2.5" fill="#ffffff" opacity="0.18"/>
    </pattern>
    <filter id="shadow" x="-20%" y="-20%" width="140%" height="150%">
      <feDropShadow dx="0" dy="24" stdDeviation="24" flood-color="#04163d" flood-opacity="0.35"/>
    </filter>
  </defs>

  <!-- Background -->
  <rect width="1600" height="1200" fill="url(#bg)"/>
  <rect width="1600" height="1200" fill="url(#dots)"/>
  <circle cx="1350" cy="180" r="320" fill="#ffffff" opacity="0.07"/>
  <circle cx="160" cy="1020" r="380" fill="#ffffff" opacity="0.06"/>
  <circle cx="1240" cy="900" r="140" fill="#5aa0ff" opacity="0.25"/>

  <g transform="translate(35 75)" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif">

    <!-- Job card -->
    <g filter="url(#shadow)">
      <rect x="420" y="260" width="540" height="310" rx="26" fill="#ffffff"/>
    </g>
    <rect x="456" y="296" width="64" height="64" rx="16" fill="url(#accent)"/>
    <path d="M476 328 l12 12 l22 -24" fill="none" stroke="#ffffff" stroke-width="7" stroke-linecap="round" stroke-linejoin="round"/>
    <text x="540" y="324" font-size="28" font-weight="700" fill="#0f172a">Build a React dashboard</text>
    <text x="540" y="354" font-size="20" fill="#64748b">Posted by Acme Studio</text>
    <rect x="456" y="396" width="410" height="12" rx="6" fill="#e2e8f0"/>
    <rect x="456" y="422" width="330" height="12" rx="6" fill="#e2e8f0"/>
    <rect x="456" y="466" width="96" height="36" rx="18" fill="#e8f0ff"/>
    <text x="504" y="491" font-size="18" font-weight="600" fill="#1b6cff" text-anchor="middle">React</text>
    <rect x="564" y="466" width="104" height="36" rx="18" fill="#e8f0ff"/>
    <text x="616" y="491" font-size="18" font-weight="600" fill="#1b6cff" text-anchor="middle">Node.js</text>
    <text x="700" y="500" font-size="30" font-weight="800" fill="#0f172a">₹45,000</text>
    <rect x="836" y="462" width="96" height="44" rx="22" fill="#1b6cff"/>
    <text x="884" y="491" font-size="19" font-weight="700" fill="#ffffff" text-anchor="middle">Apply</text>

    <!-- Hired badge -->
    <g filter="url(#shadow)">
      <rect x="880" y="200" width="250" height="84" rx="42" fill="#ffffff"/>
    </g>
    <circle cx="924" cy="242" r="26" fill="#22c55e"/>
    <path d="M912 242 l9 9 l17 -19" fill="none" stroke="#ffffff" stroke-width="6" stroke-linecap="round" stroke-linejoin="round"/>
    <text x="967" y="250" font-size="26" font-weight="700" fill="#0f172a">Hired!</text>

    <!-- Chat card -->
    <g filter="url(#shadow)">
      <rect x="720" y="520" width="480" height="330" rx="26" fill="#ffffff"/>
    </g>
    <circle cx="772" cy="572" r="26" fill="#cbd9f5"/>
    <circle cx="772" cy="564" r="9" fill="#ffffff"/>
    <path d="M756 590 q16 -18 32 0 z" fill="#ffffff"/>
    <text x="812" y="570" font-size="22" font-weight="700" fill="#0f172a">Priya · Client</text>
    <circle cx="1148" cy="566" r="7" fill="#22c55e"/>
    <text x="1130" y="572" font-size="16" fill="#64748b" text-anchor="end">online</text>
    <rect x="752" y="612" width="416" height="2" fill="#eef2f7"/>

    <rect x="752" y="636" width="270" height="52" rx="26" fill="#eef2f7"/>
    <text x="778" y="670" font-size="20" fill="#334155">Can you start this week?</text>

    <rect x="900" y="706" width="268" height="52" rx="26" fill="#1b6cff"/>
    <text x="926" y="740" font-size="20" fill="#ffffff">Yes, budget works!</text>

    <rect x="752" y="776" width="150" height="46" rx="23" fill="#eef2f7"/>
    <circle cx="796" cy="799" r="5" fill="#94a3b8"/>
    <circle cx="827" cy="799" r="5" fill="#94a3b8"/>
    <circle cx="858" cy="799" r="5" fill="#94a3b8"/>

    <!-- Freelancer profile card -->
    <g filter="url(#shadow)">
      <rect x="330" y="620" width="340" height="190" rx="26" fill="#ffffff"/>
    </g>
    <circle cx="396" cy="686" r="34" fill="url(#accent)"/>
    <circle cx="396" cy="676" r="12" fill="#ffffff"/>
    <path d="M372 710 q24 -26 48 0 z" fill="#ffffff"/>
    <text x="448" y="680" font-size="24" font-weight="700" fill="#0f172a">Arjun</text>
    <text x="448" y="708" font-size="18" fill="#64748b">Full Stack Developer</text>
    <rect x="364" y="742" width="270" height="10" rx="5" fill="#e2e8f0"/>
    <rect x="364" y="742" width="210" height="10" rx="5" fill="#1b6cff"/>
    <text x="364" y="784" font-size="17" font-weight="600" fill="#64748b">Project completed</text>
    <circle cx="616" cy="778" r="14" fill="#22c55e"/>
    <path d="M609 778 l5 5 l9 -10" fill="none" stroke="#ffffff" stroke-width="3.5" stroke-linecap="round" stroke-linejoin="round"/>
  </g>
</svg>
